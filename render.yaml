services:
  - type: web
    name: eztaxmate
    runtime: node
    buildCommand: "chmod +x render-build.sh && ./render-build.sh"
    startCommand: "node dist/index.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: eztaxmate-db
          property: connectionString

databases:
  - name: eztaxmate-db
    databaseName: eztaxmate
    plan: free